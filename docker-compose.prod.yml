# Every service here is capped on memory, CPU, processes and log size.
#
# This box is shared with the other projects (detoxy, weddypal, paupernopaper)
# and shares one kernel with them. An uncapped container does not fail on its
# own — it takes the host's memory down to the point where the OOM killer picks
# a victim, and the victim is whatever happens to be largest, not whatever
# happens to be at fault. Likewise an uncapped json-file log driver: the default
# has no max-size at all, so Django's stdout grows until the partition is full
# and then *every* site on the VPS stops writing.
#
# The numbers assume a small blog with one writer. Raise them if `docker stats`
# says so; do not remove them.

x-logging: &logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:16-alpine
    logging: *logging
    # Postgres with the stock shared_buffers (128MB) plus work_mem for a site
    # whose largest query returns a few hundred rows.
    mem_limit: 512m
    memswap_limit: 512m  # == mem_limit, so the container cannot escape into swap
    cpus: 1.0
    pids_limit: 128
    # Give it time to checkpoint instead of being killed mid-write.
    stop_grace_period: 30s
    environment:
      POSTGRES_USER: ${DB_USER:-oddly}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-oddly}
      # Refuse trust/md5 auth even on the internal network.
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    volumes:
      - pgdata:/var/lib/postgresql/data
    # No `ports:` on purpose — Postgres is reachable only from this network.
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-oddly} -d ${DB_NAME:-oddly}"]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    # Explicit, so a `docker compose build` from the dev file cannot overwrite
    # the production image — see the note in docker-compose.yml.
    image: oddlyunspecific-web-prod
    build: ./backend
    logging: *logging
    # Three gunicorn workers idle around 70MB each. 768m leaves headroom for
    # the worst legitimate request — re-encoding a 30 megapixel upload, which
    # peaks near 180MB (see UPLOAD_MAX_TOTAL_PIXELS in settings.py).
    mem_limit: 768m
    memswap_limit: 768m
    cpus: 1.5
    pids_limit: 256
    # If the *host* runs out, take this container before Postgres or another
    # project: a web worker restarting is a blip, a database being killed
    # mid-write is not.
    oom_score_adj: 500
    expose:
      - "8000"
    environment:
      DJANGO_DEBUG: "0"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY}
      DJANGO_ALLOWED_HOSTS: ${DOMAIN:?set DOMAIN},www.${DOMAIN}
      DJANGO_CSRF_TRUSTED_ORIGINS: https://${DOMAIN},https://www.${DOMAIN}
      DJANGO_ADMIN_PATH: ${DJANGO_ADMIN_PATH:?set DJANGO_ADMIN_PATH}
      JOURNAL_ENCRYPTION_KEYS: ${JOURNAL_ENCRYPTION_KEYS:?set JOURNAL_ENCRYPTION_KEYS}
      DATABASE_URL: postgres://${DB_USER:-oddly}:${DB_PASSWORD}@db:5432/${DB_NAME:-oddly}
      DB_HOST: db
      DB_PORT: "5432"
      SITE_URL: https://${DOMAIN}
      SITE_NAME: ${SITE_NAME:-oddlyunspecific}
      SITE_TAGLINE: ${SITE_TAGLINE:-}
      TRUSTED_PROXY: ${TRUSTED_PROXY:-caddy}
      TIME_ZONE: ${TIME_ZONE:-Europe/Rome}
      LANGUAGE_CODE: ${LANGUAGE_CODE:-en-us}
    volumes:
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

    # --- Container hardening ---
    # Static files are collected at image build time, migrations write only to
    # Postgres, and uploads go to the `media` volume — so the root filesystem
    # never needs to be writable.
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8000/healthz/', headers={'Host':'localhost'}), timeout=3).status==200 else sys.exit(1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

# No Caddy here on purpose: the shared Caddy of the VPS (`back_to_me_caddy`, the
# detoxy one that owns :80/:443) is attached to this project's network and
# proxies straight to `oddlyunspecific-web-1` — exactly how WeddyPal and
# PauperNoPaper are wired. The site block to paste there is in ./Caddyfile.

volumes:
  pgdata:
  media:
    # Pinned name, not the compose-generated one: the shared Caddy mounts this
    # volume read-only to serve /media/* itself, and that mount is written in a
    # file this repo does not own. See ./Caddyfile.
    name: oddlyunspecific_media
