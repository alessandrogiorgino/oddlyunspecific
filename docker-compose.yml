# Development stack. Insecure on purpose and bound to localhost only.
# Production is docker-compose.prod.yml + .env.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: oddly
      POSTGRES_PASSWORD: oddly
      POSTGRES_DB: oddly
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - devpgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oddly"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    # Distinct tag from the production one. Both compose files live in the same
    # directory and both call their service `web`, so without this they build
    # to the same image name and the last one run silently overwrites the
    # other — which now matters, because the two images differ.
    image: oddlyunspecific-web-dev
    build:
      context: ./backend
      args:
        # Pulls in requirements-dev.txt: live-reload and pip-audit. The prod
        # compose file does not set this, so neither ships to the VPS.
        INSTALL_DEV: "1"
    # --nostatic: let WhiteNoise serve /static so its no-cache header lands and
    # edits show on a soft refresh (see WHITENOISE_USE_FINDERS in settings).
    command: ["python", "manage.py", "runserver", "--nostatic", "0.0.0.0:8000"]
    environment:
      DJANGO_DEBUG: "1"
      DJANGO_SECRET_KEY: dev-insecure-not-for-production
      DJANGO_ADMIN_PATH: admin
      DATABASE_URL: postgres://oddly:oddly@db:5432/oddly
      DB_HOST: db
      DB_PORT: "5432"
      SITE_URL: http://localhost:8000
      SITE_NAME: oddlyunspecific
      SITE_TAGLINE: Thoughts, mostly
      TRUSTED_PROXY: none
      TIME_ZONE: Europe/Rome
      # Dev-only Fernet key. Production reads it from .env and refuses to boot
      # without one.
      JOURNAL_ENCRYPTION_KEYS: ZGV2LW9ubHktZmVybmV0LWtleS1ub3Qtc2VjdXJlISE=
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend:/app
      - devmedia:/app/media
    depends_on:
      db:
        condition: service_healthy

volumes:
  devpgdata:
  devmedia:
